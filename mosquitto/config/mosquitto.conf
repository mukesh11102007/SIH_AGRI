# Mosquitto MQTT Broker Configuration
# ============================================================
# Local-network-only configuration.
# No anonymous access — device authentication required.
# ============================================================

# ── Plain MQTT (TCP) — for ESP32 and backend ─────────────────
listener 1883 0.0.0.0
protocol mqtt

# ── MQTT over WebSocket — optional browser clients ────────────
listener 9001 0.0.0.0
protocol websockets

# Authentication (applies to all listeners)
allow_anonymous false
password_file /mosquitto/config/passwd

# Persistence (survive broker restarts)
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection settings
max_keepalive 120
max_connections 100

# Message settings
max_queued_messages 1000
queue_qos0_messages false

# QoS 1 delivery guarantee — important for field reliability
max_inflight_messages 20
